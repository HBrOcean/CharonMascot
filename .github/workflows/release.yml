name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            asset: CharonMascot-Windows-x64.zip
          - os: ubuntu-latest
            rid: linux-x64
            asset: CharonMascot-Linux-x64.zip
          - os: macos-latest
            rid: osx-arm64
            asset: CharonMascot-macOS-arm64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish (${{ matrix.rid }})
        shell: bash
        run: |
          dotnet publish src/CharonMascot -c Release -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -o out

      - name: Remove symbols
        shell: bash
        run: rm -f out/*.pdb || true

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        working-directory: out
        run: zip -r "../${{ matrix.asset }}" . -q

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item "使用说明.txt" -Destination "out\" -ErrorAction SilentlyContinue
          Compress-Archive -Path "out\*" -DestinationPath "${{ matrix.asset }}" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          body: |
            ## 卡戎桌宠 ${{ github.ref_name }}

            解压后直接双击运行，`Assets` 目录必须与可执行文件在同一层。

            | 平台 | 文件 |
            | --- | --- |
            | Windows x64 | `CharonMascot-Windows-x64.zip` |
            | Linux x64 | `CharonMascot-Linux-x64.zip` |
            | macOS arm64 | `CharonMascot-macOS-arm64.zip` |

            角色素材版权归 Bluepoch 所有，仅供个人学习交流使用。
