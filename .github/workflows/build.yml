name: build

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Publish
        shell: bash
        run: |
          dotnet publish src/CharonMascot -c Release -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -o out

      - name: Smoke test (assets present)
        shell: bash
        run: |
          test -f out/Assets/characters/312801/312801.skel
          test -f out/Assets/icons/app.png

      - uses: actions/upload-artifact@v4
        with:
          name: CharonMascot-${{ matrix.rid }}
          path: out/
          if-no-files-found: error
